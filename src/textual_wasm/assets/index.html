<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>textual-wasm spike</title>
    <!-- Inline, so the browser never issues the /favicon.ico request it makes by default.
         That 404 is invisible in a browser and a failure in the headless harness, which
         treats any page-reported error as a failed run. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='14' font-family='monospace'%3E%26gt;_%3C/text%3E%3C/svg%3E"
    />
    <!-- xterm's stylesheet is injected at boot from the build manifest, so its version
         lives in exactly one place. -->
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body class="page">
    <header class="masthead">
      <h1>Textual under WebAssembly</h1>
      <p id="status" class="status" data-state="booting">booting Pyodide&hellip;</p>
    </header>
    <main class="stage">
      <!-- Two elements, not one, and the nesting is load-bearing: the frame is decorated
           and the mount is bare. FitAddon divides the mount's *parent* box by the cell size
           to choose a row count, so any padding or border on the element xterm opens into is
           counted as usable space and the last rows are drawn outside the visible box. -->
      <div class="terminal-frame">
        <div id="terminal" class="terminal-mount"></div>
      </div>
    </main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
