<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Replaced at boot by the title the build was given. Present as a fallback so the tab
         is never blank while Pyodide starts. -->
    <title>Terminal</title>
    <!-- Inline, so the browser never issues the /favicon.ico request it makes by default.
         That 404 is invisible in a browser and a failure in the headless harness, which
         treats any page-reported error as a failed run. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='14' font-family='monospace'%3E%26gt;_%3C/text%3E%3C/svg%3E"
    />
    <!-- xterm's stylesheet is injected at boot from the build manifest, so its version
         lives in exactly one place. -->
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <!--
    Deliberately bare: the terminal fills the viewport and the page adds nothing around it.
    A Textual app draws its own header, footer and title, so page chrome would be a second,
    competing frame around an application that already has one - and a heading naming this
    project would end up on someone else's product.

    Replace this file wholesale with `textual-wasm build --template <dir>`. The contract is
    small: an element with `id="terminal"` for the terminal to open into, and a `<script
    type="module" src="./main.mjs">`. An element with `id="status"` is optional; without one
    the boot messages go to the console instead.
  -->
  <body class="page">
    <main class="stage">
      <!-- Two elements, not one, and the nesting is load-bearing: the frame is decorated
           and the mount is bare. FitAddon divides the mount's *parent* box by the cell size
           to choose a row count, so any padding or border on the element xterm opens into is
           counted as usable space and the last rows are drawn outside the visible box. -->
      <div class="terminal-frame">
        <div id="terminal" class="terminal-mount"></div>
      </div>
    </main>
    <!-- Outside the terminal's box and out of the layout, because it is transient: booting
         Pyodide takes seconds, and a page that is blank for that long reads as broken. It
         removes itself once the app is running. -->
    <p id="status" class="status" data-state="booting">starting&hellip;</p>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
