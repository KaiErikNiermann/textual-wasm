# Gates, then the cross-runtime check.
#
# Split into two jobs on purpose. `gates` is what a push has to satisfy and takes seconds;
# `check` boots a real Pyodide, a real Chrome and a real pty, which is minutes and needs the
# network. Merging them would mean a lint failure and a runtime regression arrive as the same
# red mark.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Without it semgrep-core fails intermittently with `Unix_error: Cannot allocate memory
  # io_uring_queue_init` and returns an empty results list - a crashed scan then looks
  # exactly like a clean one.
  EIO_BACKEND: posix

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of `requires-python`. The floor is the one that catches
        # syntax this project would otherwise adopt without noticing.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pipx install poetry
      - run: poetry install
      - name: install the Pyodide runtime
        # The characterisation tests re-measure every claim in the substitution registry
        # inside a real Pyodide. They skip cleanly without it - a suite that fails for a
        # missing optional tool is one people learn to ignore - so if this step were absent
        # the registry could drift with CI green.
        run: pnpm install --frozen-lockfile
      - name: ruff (lint)
        run: poetry run ruff check src tests
      - name: ruff (format)
        run: poetry run ruff format --check src tests
      - name: pyright (strict)
        run: poetry run pyright
      - name: radon (nothing above grade B)
        run: |
          offenders="$(poetry run radon cc -n C src)"
          if [[ -n "${offenders}" ]]; then
            echo "${offenders}"
            echo "error: blocks above grade B; simplify or split them" >&2
            exit 1
          fi
      - name: semgrep (conventions + core-utils)
        run: |
          poetry run semgrep --config .semgrep/conventions.yml \
            --config .semgrep/core-utils.yml --metrics=off --error --quiet src
      - name: eslint + stylelint + principled-css
        # A stylesheet in an example shipped unlayered because these gates existed but were
        # only ever run by hand.
        run: pnpm lint:all
      - name: pytest
        # Browser-driving tests are deselected here and required in the `check` matrix,
        # which is the job that installs engines. Naming them rather than letting them skip
        # keeps "this machine has no browser" from looking like "these tests passed".
        run: poetry run pytest -m "not browser"
      - name: the porting matrix is a rendering of the registry
        run: poetry run textual-wasm matrix --check -o docs/porting-matrix.md

      - name: the library support table is a rendering of the registry
        run: poetry run textual-wasm libraries --check -o docs/library-table.md

  check:
    # The claim this project makes, checked rather than asserted: the same app on CPython,
    # on Pyodide, in a browser and on a real pty, compared. `--strict` is what makes it a
    # gate - without it a runner missing tmux would still print a verdict, and the verdict
    # would cover fewer runtimes than the badge implies.
    #
    # Once per browser engine, and that is the whole engine space: Edge, Brave and Opera are
    # Chromium with the same xterm.js on top, so running them would measure the same
    # renderer twice. Real Safari is not here either - Playwright's WebKit is a different
    # port with a different font stack - and is covered weekly by `safari.yml` instead.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pipx install poetry
      - run: poetry install
      - name: build tmux from source
        # The distribution's tmux is 3.4, and 3.4 is not a usable render reference: fed the
        # identical byte stream it places a VS16 emoji one column further along than Chrome
        # does. Measured across three versions - 3.4 disagrees, 3.5a and 3.7c agree with
        # Chrome exactly - which is where the >= 3.5 floor in `textual_wasm.terminal` comes
        # from. With the packaged version this leg would refuse to run and `--strict` would
        # fail, correctly. An official release tarball, checksummed.
        env:
          TMUX_VERSION: "3.5a"
          TMUX_SHA256: "16216bd0877170dfcc64157085ba9013610b12b082548c7c9542cc0103198951"
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
          curl -fsSL -o tmux.tar.gz \
            "https://github.com/tmux/tmux/releases/download/${TMUX_VERSION}/tmux-${TMUX_VERSION}.tar.gz"
          echo "${TMUX_SHA256}  tmux.tar.gz" | sha256sum --check --strict
          tar xf tmux.tar.gz
          cd "tmux-${TMUX_VERSION}"
          ./configure --quiet
          make -j"$(nproc)" --silent
          sudo make install
          tmux -V
      - name: install the Pyodide runtime and the browser engine
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: check every runtime
        run: poetry run textual-wasm check --strict --browser ${{ matrix.browser }}
      - name: check every runtime again, with Python in a Web Worker
        # A worker build has to render identically - that is the whole claim - so this is
        # the same comparison, not a lesser one. Run on every engine because the worker is
        # the part most likely to differ between them: it is the only mode whose output
        # crosses a thread boundary.
        run: poetry run textual-wasm check --strict --worker --browser ${{ matrix.browser }}
      - name: a worker keeps the page responsive, and the main thread does not
        # The measurement worker mode exists for, and the one thing the render comparison
        # above cannot see. Chromium only: this is a fact about where the interpreter runs,
        # not about how an engine paints, and running it three times measures it three
        # times rather than measuring three things.
        if: matrix.browser == 'chromium'
        run: poetry run pytest tests/test_responsiveness.py -v
      - name: the registry's claims, re-measured under Pyodide
        # Pyodide is the same build in every leg of this matrix, so this is measured once.
        if: matrix.browser == 'chromium'
        run: node scripts/run-substitution-check.mjs > substitutions.json
      - uses: actions/upload-artifact@v5
        if: always() && matrix.browser == 'chromium'
        with:
          name: substitution-measurements
          path: substitutions.json

  example:
    # The examples are code people copy, so they are held to the same standard as the package
    # - each in its own environment, which is also a check that it really is self-contained.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: simple-app
            package: simple_app
            entry: simple_app.app:TaskList
          - directory: embedded-page
            package: dashboard_app
            entry: dashboard_app.app:Dashboard
          - directory: svelte-app
            package: palette_app
            entry: palette_app.app:Palette
    defaults:
      run:
        working-directory: examples/${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pipx install poetry
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run pyright
      - name: the example is portable, and says so
        run: poetry run textual-wasm doctor ${{ matrix.entry }}
      - name: it builds to a static site
        run: poetry run textual-wasm build ${{ matrix.entry }} ${{ matrix.package }} -o dist/
      # Only svelte-app has a JavaScript build. Without this its devDependencies are
      # declared and never compiled, so a dependency bump there is unverifiable - the
      # `terminal` script above builds the Python side and says nothing about the wrapper.
      - uses: pnpm/action-setup@v4
        if: matrix.directory == 'svelte-app'
        with:
          version: 10
      - uses: actions/setup-node@v6
        if: matrix.directory == 'svelte-app'
        with:
          node-version: "22"
      - name: the framework wrapper compiles against its pinned plugin
        if: matrix.directory == 'svelte-app'
        run: pnpm install --frozen-lockfile && pnpm build

  docs:
    # Built on every push, published only from the default branch by `pages.yml`. A docs build
    # that only runs at release time is a docs build that is broken at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: pipx install poetry
      - run: poetry install
      - name: build the site and its live demos
        run: ./scripts/build-docs.sh
      - name: the whole site fits well inside a Pages deployment
        run: |
          size=$(du -sm docs/_build/html | cut -f1)
          echo "site: ${size} MB"
          test "${size}" -lt 200
