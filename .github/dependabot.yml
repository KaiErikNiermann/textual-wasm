# Weekly, and deliberately narrow.
#
# Every ecosystem sets a seven-day cooldown. A version published an hour ago has had an hour
# of scrutiny, and the supply-chain attacks that matter are caught in days rather than in
# minutes - so waiting a week costs nothing here and closes the window in which a compromised
# release arrives as a routine-looking PR.
#
# The PR limit is the load-bearing setting: this project pins Pyodide, xterm.js and the whole
# Python closure on purpose, because two runtimes are only comparable when they load the same
# code. A flood of version bumps is not maintenance here - each one changes what the
# cross-runtime check is checking, and has to be read rather than merged.
#
# The limits are per entry, so the queue is bounded by their sum: five open PRs at most. Every
# entry folds its minor and patch bumps into one grouped PR, which counts once against the
# limit; majors still arrive one per PR, because they are the ones that need reading on their
# own. Dependabot's own security updates are counted separately and are not capped by this.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # Two rather than one: 0.x tooling (ruff, pyright) reports breaking bumps as majors, and one
    # of those sitting red must not hold back the week's runtime pins.
    open-pull-requests-limit: 2
    groups:
      # One PR for the linters, which move together and are never load-bearing.
      dev-tooling:
        patterns: ["ruff", "pyright", "radon", "semgrep", "pytest*", "types-*"]
        update-types: [minor, patch]
      # Everything else in the closure. Groups match in order, so the linters never land here.
      runtime:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Textual's version is pinned into the comparison itself: a release changes what the
      # eight checks are checking, so it is upgraded deliberately with a check run, never by
      # an automatic merge.
      - dependency-name: textual
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      npm-root:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The runtime versions live in `bundler.py` and are pinned there; these entries exist so
      # the harnesses can run, and bumping them without bumping the pins would make the
      # harness test a different runtime than the one that ships.
      - dependency-name: pyodide
      - dependency-name: "@xterm/*"

  # The example and the playground share Vite, so one entry spanning both turns a Vite release
  # into one PR instead of two.
  - package-ecosystem: npm
    directories: [/examples/svelte-app, /playground]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      frontends:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
