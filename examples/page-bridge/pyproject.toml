[project]
name = "page-bridge"
version = "0.1.0"
description = "A Textual app sharing live state with the page around it, in both directions."
authors = [{ name = "textual-wasm example" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = ["textual (>=8.2,<9.0)", "textual-wasm (>=0.1.1)"]

[project.scripts]
mixer-app = "mixer_app.app:main"

[tool.poetry]
packages = [{ include = "mixer_app" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.15"
pyright = "^1.1"
textual-wasm = { path = "../..", develop = true }

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.pyright]
include = ["mixer_app"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
