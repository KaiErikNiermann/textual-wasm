[project]
name = "embedded-page"
version = "0.1.0"
description = "A Textual app embedded in an ordinary HTML page and driven from it."
authors = [{ name = "textual-wasm example" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = ["textual (>=8.2,<9.0)"]

[project.scripts]
dashboard-app = "dashboard_app.app:main"

[tool.poetry]
packages = [{ include = "dashboard_app" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.15"
pyright = "^1.1"
textual-wasm = { path = "../..", develop = true }

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.pyright]
include = ["dashboard_app"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
