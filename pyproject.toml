[project]
name = "textual-wasm"
version = "0.1.0"
description = "Feasibility spike: running a Textual TUI fully client-side under WebAssembly."
authors = [{ name = "KaiErikNiermann", email = "61298289+KaiErikNiermann@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "textual (>=8.2,<9.0)",
    "typer (>=0.15,<1.0)",
    "rich (>=13.0)",
    "pyte (>=0.8.2,<0.9.0)",
]

[project.scripts]
textual-wasm-spike = "textual_wasm.__main__:app"

[tool.poetry]
packages = [{ include = "textual_wasm", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"
ruff = "^0.15"
pyright = "^1.1"
radon = "^6.0"
semgrep = "^1.100"
pyyaml = "^6.0.3"
types-pyyaml = "^6.0.12.20260906"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
# Deliberately non-compliant code that exists to prove the semgrep rules still fire.
extend-exclude = ["tests/semgrep/positive"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "ISC",       # implicit str concat
    "PIE",       # misc lints
    "PT",        # pytest style
    "RET",       # return
    "SIM",       # simplify
    "TID",       # tidy imports
    "PTH",       # use pathlib
    "PL",        # pylint
    "TRY",       # tryceratops
    "RUF",       # ruff-specific
    "ANN",       # annotations (pyright-strict's partner)
    "S",         # bandit
]
ignore = [
    "ANN401",  # Any is banned by convention, not by this rule's blunt form
    "TRY003",  # long messages inside raise are fine and more useful than a constant
    "ISC001",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]  # asserts and literal comparisons are the point of a test

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --- Pyright ----------------------------------------------------------------
[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["tests/semgrep/positive"]
# Hand-written stubs for the Pyodide `js` module, which exists only inside the runtime.
stubPath = "typings"
# `js` is stub-only by nature: the module exists only inside the Pyodide runtime, so a
# missing source is the expected state rather than a finding.
reportMissingModuleSource = "none"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

# --- Pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # pytest-asyncio 0.25 still uses the event-loop policy APIs CPython 3.16 will remove.
    # Third-party noise, and turning it into an error would fail every async test here.
    "ignore:'asyncio\\.(get|set)_event_loop_policy' is deprecated:DeprecationWarning",
]
